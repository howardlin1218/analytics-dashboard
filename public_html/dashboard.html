<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Check for saved theme preference directly in head to prevent FOUC
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme && savedTheme === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <script src="./app.js" defer></script>

    <link rel="icon" type="image/png" href="./favicons/google-analytics-black.png">
</head>
<body> 

    <header class="top-nav">
        <div class="brand">
            <img src="./favicons/google-analytics-black.png">
        </div>
        <div class="user-profile">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            <span id="user-display-name">User</span>
            <a id="logout-btn">Sign Out</a>
        </div>
    </header>

    <div id="sidebar" class="header">
        <div id="header-group">
            <a href="#/overview" id="nav-overview">Overview</a>
            <a href="#/performance" id="nav-performance">Performance</a>
            <a href="#/errors" id="nav-errors">Errors</a>
            <a href="#/sessions" id="nav-sessions">Sessions</a>
            <a href="#/reports" id="nav-reports">Reports</a>
            <a href="#/admin" id="nav-admin">Admin Panel</a>
        </div>

        <div class="sidebar-toggle-wrapper">
            <button id="sidebar-toggle" class="toggle-btn" aria-label="Toggle Menu">
                <span class="sidebar-arrow"></span>
            </button>
        </div>
    </div>

    <div id="viewport-wrapper"> 
        <main id="app-viewport">
        </main>
    </div>

    <div id="report-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Generate Analytics Report</h3>
            <textarea id="report-comments" rows="6"></textarea>

            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeReportModal()">Cancel</button>
                <button class="modal-btn btn-save" onclick="submitReport()" id="btn-generate-report">Generate & Save PDF</button>
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        
        // Setup initial icon
        if (document.documentElement.classList.contains('dark-theme')) {
            themeToggle.innerHTML = '☀️';
        }
        
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '☀️' : '🌙';

            // Also reload the charts with appropriate colors if they exist
            if (typeof Chart !== 'undefined') {
                Chart.defaults.color = isDark ? '#cbd5e1' : '#666';
                Chart.defaults.scale.grid.color = isDark ? '#334155' : '#e5e7eb';
                if (window.activeCharts) {
                    window.activeCharts.forEach(chart => chart.update());
                }
            }
        });

        // Initialize chart defaults right away if needed
        if (typeof Chart !== 'undefined') {
            const isDarkInit = document.documentElement.classList.contains('dark-theme');
            Chart.defaults.color = isDarkInit ? '#cbd5e1' : '#666';
            Chart.defaults.scale.grid.color = isDarkInit ? '#334155' : '#e5e7eb';
        }
    </script>
</body>
</html>
